[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "hcwnd"
path = "src/lib/lib.rs"

[[bin]]
name = "hcwnd_server"
path = "src/bin/server.rs"

[dependencies]
actix-files = "0.7.0"
actix-htmx = "0.4.1"
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["redis-pool", "redis-session"] }
actix-utils = "3.0.2"
actix-web = "4.15.0"
actix-web-helmet = "1.0.2"
actix-web-lab = "0.27.0"
anyhow = { workspace = true }
api = { workspace = true }
argon2 = "0.6.0"
async-trait = { workspace = true }
chrono = { workspace = true }
deadpool-redis = "0.23.1"
derive_builder = { workspace = true }
env_logger = "0.11.11"
es-entity = { version = "0.14.1" }
futures = "0.3.34"
imgproxy = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
log = "0.4.34"
mime_guess = "2.0.5"
nutype = { version = "0.8.0", features = ["regex", "serde"] }
rayon = "1.12.0"
regex = "1.13.1"
rust-embed = { version = "8.12.0", features = ["actix-web", "deterministic-timestamps", "include-exclude"] }
secrecy = "0.10.3"
serde = { workspace = true }
serde_qs = { version = "1.1.3", features = ["actix4"] }
serde_with = { workspace = true }
sqlx = { version = "0.9.0", features = ["postgres", "macros", "migrate", "uuid", "chrono", "runtime-tokio" ] }
thiserror = { workspace = true }
tracing-actix-web = "0.7.25"
ui = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
maud = { workspace = true, features = ["actix-web"] }
config = "0.15.26"
aws-config = "1.12.0"
aws-sdk-s3 = "1.149.0"
# https://github.com/smithy-lang/smithy-rs/issues/4853
aws-smithy-json = "=0.63.1"
aws-smithy-types = "=1.8.0"
image = "0.25.10"
actix-multipart = "0.8.4"
eventwise = { path = "../../../private/eventwise/", features = ["postgres"] }
domain = { path = "../domain" }

[build-dependencies]
grass = "0.13.4"

[package.metadata.cargo-machete]
ignored = ["regex", "grass"]
