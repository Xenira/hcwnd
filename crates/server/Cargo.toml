[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "hcwnd"
path = "src/lib/lib.rs"

[[bin]]
name = "hcwnd_server"
path = "src/bin/server.rs"

[dependencies]
actix-files = "0.6.10"
actix-htmx = "0.4.1"
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["redis-pool", "redis-session"] }
actix-utils = "3.0.1"
actix-web = "4.15.0"
actix-web-helmet = "1.0.2"
actix-web-lab = "0.26.0"
anyhow = "1.0.104"
api = { workspace = true }
argon2 = "0.5.3"
async-trait = "0.1.92"
chrono = { workspace = true }
deadpool-redis = "0.22.1"
derive_builder = { workspace = true }
env_logger = "0.11.11"
es-entity = { version = "0.10.41" }
futures = "0.3.34"
imgproxy = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
log = "0.4.34"
mime_guess = "2.0.5"
nutype = { version = "0.6.2", features = ["regex", "serde"] }
rayon = "1.12.0"
regex = "1.13.1"
rust-embed = { version = "8.12.0", features = ["actix-web", "deterministic-timestamps", "include-exclude"] }
secrecy = "0.10.3"
serde = { workspace = true }
serde_qs = { version = "1.1.3", features = ["actix4"] }
serde_with = { workspace = true }
sqlx = { version = "0.8.6", features = ["postgres", "macros", "migrate", "uuid", "chrono", "runtime-tokio" ] }
thiserror = { workspace = true }
tracing-actix-web = "0.7.22"
ui = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
maud = { workspace = true, features = ["actix-web"] }
config = "0.15.25"
aws-config = "1.12.0"
aws-sdk-s3 = "1.146.1"
# https://github.com/smithy-lang/smithy-rs/issues/4853
aws-smithy-json = "=0.63.0"
aws-smithy-types = "=1.6.3"
image = "0.25.10"

[build-dependencies]
grass = "0.13.4"

[package.metadata.cargo-machete]
ignored = ["regex", "grass"]
