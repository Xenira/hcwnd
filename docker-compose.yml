services:
  traefik:
    image: traefik:v3.6.10
    volumes:
      - ${XDG_RUNTIME_DIR}/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command:
      - --entryPoints.web.address=:80
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls=true

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
    networks:
      - traefik
    extra_hosts:
      - "backend:${IP_ADDRESS:?}"
    labels:
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      # Enable self‑routing
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`hardcore.localhost`) || Host(`localhost`)"
      - "traefik.http.routers.backend.entrypoints=web,websecure"
      # - "traefik.http.services.backend.loadbalancer.server.port=8090"
      - "traefik.http.services.backend.loadbalancer.server.url=http://backend:8090"
      # - traefik.http.routers.backend.middlewares=anubis@docker
      # - traefik.http.middlewares.anubis.forwardauth.address=http://anubis:8080/.within.website/x/cmd/anubis/api/check
  # anubis:
  #   image: ghcr.io/techarohq/anubis:main
  #   environment:
  #     # Telling Anubis, where to listen for Traefik
  #     - BIND=:8080
  #     # Telling Anubis to do redirect — ensure there is a space after '='
  #     - "TARGET= "
  #     # Specifies which domains Anubis is allowed to redirect to.
  #     - REDIRECT_DOMAINS=hardcore.localhost:8443
  #     # Should be the full external URL for Anubis (including scheme)
  #     - PUBLIC_URL=https://anubis.localhost:8443
  #     # Should match your domain for proper cookie scoping
  #     # - COOKIE_DOMAIN=localhost
  #     - COOKIE_DYNAMIC_DOMAIN=true
  #   networks:
  #     - traefik
  #   labels:
  #     - traefik.enable=true # Enabling Traefik
  #     - traefik.docker.network=traefik # Telling Traefik which network to use
  #     - traefik.http.routers.anubis.rule=Host(`anubis.localhost`) # Only Matching Requests for example.com
  #     - traefik.http.routers.anubis.entrypoints=websecure # Listen on HTTPS
  #     - traefik.http.services.anubis.loadbalancer.server.port=8080 # Telling Traefik where to receive requests
  #     - traefik.http.routers.anubis.service=anubis # Telling Traefik to use the above specified port
  #     # - traefik.http.routers.anubis.tls.certresolver=le # Telling Traefik to resolve a Cert for Anubis

  postgres:
    image: postgres:18.3
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: postgres
      POSTGRES_DB: timetable
    ports:
      - "5432:5432"
  valkey:
    image: valkey/valkey:9.0.3-alpine
    ports:
      - "6379:6379"

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.15
    restart: always
    depends_on:
      rustfs_setup:
        condition: service_completed_successfully
    environment:
      IMGPROXY_PATH_PREFIX: /image
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: false
      IMGPROXY_KEY: ${IMGPROXY_KEY:?}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?}
      IMGPROXY_USE_S3: true
      IMGPROXY_S3_ENDPOINT: http://rustfs:9000
    secrets:
      - imgproxy_key
      - imgproxy_salt
    volumes:
      - imagepoxy_secrets:/home/imgproxy/:ro
    networks:
      - traefik
      - rustfs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imgproxy.rule=Host(`hardcore.localhost`) && PathPrefix(`/image`)"
      - "traefik.http.routers.imgproxy.entrypoints=websecure"
      - "traefik.http.routers.imgproxy.tls=true"
      - "traefik.http.services.imgproxy.loadbalancer.server.port=8080"

  swapbook:
    build:
      dockerfile: Dockerfile
      target: swapbook
    restart: unless-stopped
    extra_hosts:
      - "backend:${IP_ADDRESS:?}"
    command:
      - "-target=http://backend:8090"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swapbook.rule=Host(`swapbook.localhost`)"
      - "traefik.http.routers.swapbook.entrypoints=websecure,web"
      - "traefik.http.services.swapbook.loadbalancer.server.port=7007"

  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./data/rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    volumes:
      - ./data/rustfs/data:/data
      - ./data/rustfs/logs:/var/log/rustfs/
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: false
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    networks:
      - rustfs
    secrets:
      - source: rustfs_access_key
        mode: 0o755
      - source: rustfs_secret_key
    healthcheck:
      # Default behavior:
      # - HTTP when RUSTFS_TLS_PATH is unset
      # - HTTPS when RUSTFS_TLS_PATH is set
      # - loopback TLS uses `-k` unless strict host+CA values are provided
      #
      # Strict TLS example:
      # - set RUSTFS_HEALTHCHECK_HOST to a SAN-covered hostname
      # - optionally set RUSTFS_HEALTHCHECK_CA (defaults to /opt/tls/ca.crt when present)
      test: ["CMD", "sh", "-ec", 'curl -fsS "http://127.0.0.1:9000/health"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rustfs_setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: rustfs
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - imagepoxy_secrets:/secrets/image-proxy:rw
      - ./crates/server/.aws:/secrets/app:rw
    networks:
      - rustfs
    secrets:
      - rustfs_access_key
      - rustfs_secret_key

networks:
  traefik:
    name: traefik
  rustfs:

volumes:
  imagepoxy_secrets:

secrets:
  imgproxy_key:
    environment: IMGPROXY_KEY
  imgproxy_salt:
    environment: IMGPROXY_SALT
  rustfs_access_key:
    environment: RUSTFS_ACCESS_KEY
  rustfs_secret_key:
    environment: RUSTFS_SECRET_KEY
